name: Production gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
      E2E_ADMIN_EMAIL: ${{ secrets.STAGING_E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.STAGING_E2E_ADMIN_PASSWORD }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.STAGING_E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.STAGING_E2E_CUSTOMER_PASSWORD }}
      RUN_ANALYTICS_E2E: ${{ secrets.STAGING_E2E_ADMIN_EMAIL != '' && '1' || '0' }}
      EMAIL_DELIVERY_MODE: capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start local PostgreSQL for migration tests
        run: >-
          supabase start
          --exclude storage-api,logflare,vector,studio,imgproxy,edge-runtime,mailpit,postgres-meta,postgrest,realtime,gotrue,kong,supavisor
      - run: supabase db reset
      - run: supabase db lint --local --fail-on error
      - run: supabase test db
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

      # ── Guardián SDD ──────────────────────────────────────────────────────
      # Corre aquí y no en su propio workflow porque este job ya ejecuta las tres
      # suites con los secretos y la base de datos que necesitan: duplicarlo sería
      # 25 minutos repetidos y dos copias de la misma configuración divergiendo.
      # `if: always()` cumple el papel del `continue-on-error` que pide el kit —
      # si una suite falla, el guardián lo refleja como ❌ en su criterio en vez de
      # no llegar a contarlo. Ver docs/adr/0002.
      - name: Guardián — cada criterio tiene quien lo demuestre
        if: always()
        run: node herramientas/trazabilidad.ts

      - name: Documentación (enlaces, anclas y diagramas)
        if: always()
        run: node herramientas/verificar-docs.ts

      - name: La matriz generada tiene que estar commiteada
        if: always()
        run: |
          if ! git diff --exit-code -- docs/specs/TRAZABILIDAD.md; then
            echo "::error::La matriz commiteada no coincide con la de CI. Tráela con: node herramientas/traer-matriz.ts"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trazabilidad
          path: docs/specs/TRAZABILIDAD.md
          retention-days: 14

  migration-dry-run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Link staging
        run: supabase link --project-ref "$STAGING_PROJECT_REF" --password "$STAGING_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      - run: supabase db push --linked --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
